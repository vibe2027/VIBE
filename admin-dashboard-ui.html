<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 28px;
      color: #D4AF37;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-info {
      text-align: right;
    }

    .user-info p {
      margin: 5px 0;
      font-size: 14px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .tab-btn.active {
      border-color: #D4AF37;
      background: rgba(212, 175, 55, 0.2);
      color: #D4AF37;
    }

    .tab-content {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 30px;
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .stat-card h3 {
      color: #D4AF37;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
    }

    .table-container {
      overflow-x: auto;
      margin: 20px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background: rgba(212, 175, 55, 0.2);
      color: #D4AF37;
      padding: 12px;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    tr:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .action-btn {
      padding: 6px 12px;
      margin: 0 4px;
      font-size: 12px;
      background: #667eea;
      border-radius: 4px;
    }

    .action-btn.danger {
      background: #e74c3c;
    }

    .action-btn.success {
      background: #27ae60;
    }

    .form-group {
      margin: 15px 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #D4AF37;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #D4AF37;
      background: rgba(212, 175, 55, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(39, 174, 96, 0.2);
      border: 1px solid #27ae60;
      color: #2ecc71;
    }

    .alert.error {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #D4AF37;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1a1a2e;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #e0e0e0;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .close-btn:hover {
      color: #D4AF37;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.admin {
      background: #e74c3c;
      color: white;
    }

    .badge.co-founder {
      background: #f39c12;
      color: white;
    }

    .badge.user {
      background: #3498db;
      color: white;
    }

    .badge.verified {
      background: #27ae60;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>🌊 VIBE Admin Dashboard</h1>
      <div class="user-info">
        <p><strong id="userEmail">Loading...</strong></p>
        <p>Role: <span id="userRole" class="badge">admin</span></p>
        <button onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- Alert Messages -->
    <div id="alert" class="alert"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('stats')">📊 Dashboard</button>
      <button class="tab-btn" onclick="switchTab('users')">👥 Users</button>
      <button class="tab-btn" onclick="switchTab('tribunal')">⚖️ Tribunal</button>
      <button class="tab-btn" onclick="switchTab('pubs')">📢 Pubs</button>
      <button class="tab-btn" onclick="switchTab('billets')">💸 Billets</button>
      <button class="tab-btn" onclick="switchTab('activity')">📈 Activity</button>
    </div>

    <!-- Dashboard Tab -->
    <div id="stats" class="tab-content active">
      <h2>Dashboard Stats</h2>
      <div class="stats-grid" id="statsGrid">
        <div class="loading">Loading statistics...</div>
      </div>
    </div>

    <!-- Users Tab -->
    <div id="users" class="tab-content">
      <h2>User Management</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Search/Filter:</label>
          <input type="text" id="userSearch" placeholder="Search by email..." onkeyup="searchUsers()">
        </div>
      </div>
      <div class="table-container" id="usersTable">
        <div class="loading">Loading users...</div>
      </div>
    </div>

    <!-- Tribunal Tab -->
    <div id="tribunal" class="tab-content">
      <h2>Tribunal Cases</h2>
      <div class="form-group">
        <label>Filter by Status:</label>
        <select onchange="loadTribunalCases(this.value)">
          <option value="open">Open</option>
          <option value="under_review">Under Review</option>
          <option value="resolved">Resolved</option>
          <option value="dismissed">Dismissed</option>
        </select>
      </div>
      <div class="table-container" id="tribunalTable">
        <div class="loading">Loading cases...</div>
      </div>
    </div>

    <!-- Pubs Tab -->
    <div id="pubs" class="tab-content">
      <h2>Pubs Management</h2>
      <div class="table-container" id="pubsTable">
        <div class="loading">Loading pubs...</div>
      </div>
    </div>

    <!-- Billets Tab -->
    <div id="billets" class="tab-content">
      <h2>Billets Management</h2>
      <div class="form-group">
        <input type="text" id="billetsSearch" placeholder="Search user by email..." onkeyup="searchBilletsUser()">
      </div>
      <div id="billetsForm" style="display: none;">
        <div class="form-row">
          <div class="form-group">
            <label>User ID:</label>
            <input type="text" id="billetsUserId" readonly>
          </div>
          <div class="form-group">
            <label>Amount to Adjust:</label>
            <input type="number" id="billetsAmount" placeholder="Enter amount (+ or -)">
          </div>
          <div class="form-group">
            <label>Reason:</label>
            <input type="text" id="billetsReason" placeholder="Reason for adjustment">
          </div>
        </div>
        <button onclick="adjustBillets()">Adjust Billets</button>
      </div>
      <div class="table-container" id="billetsTable"></div>
    </div>

    <!-- Activity Tab -->
    <div id="activity" class="tab-content">
      <h2>Activity Log (Last 7 Days)</h2>
      <div class="table-container" id="activityTable">
        <div class="loading">Loading activity...</div>
      </div>
    </div>
  </div>

  <!-- Resolution Modal -->
  <div id="resolutionModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Resolve Tribunal Case</h3>
        <button class="close-btn" onclick="closeModal('resolutionModal')">×</button>
      </div>
      <div class="form-group">
        <label>Resolution:</label>
        <textarea id="resolutionText" placeholder="Enter resolution details..." rows="4"></textarea>
      </div>
      <button onclick="submitResolution()">Submit Resolution</button>
    </div>
  </div>

  <script>
    // Global state
    let currentCase = null;
    let authToken = localStorage.getItem('authToken');
    const API_BASE = 'http://localhost:3000';

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      const userRole = localStorage.getItem('userRole');
      const userEmail = localStorage.getItem('userEmail');

      if (!authToken || userRole !== 'admin') {
        window.location.href = '/login.html';
        return;
      }

      document.getElementById('userEmail').textContent = userEmail;
      loadDashboardStats();
      loadUsers();
      loadTribunalCases('open');
      loadPubs();
      loadActivity();
    });

    // Helper: Fetch with auth
    async function fetchAPI(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'x-user-role': 'admin',
        'x-user-id': localStorage.getItem('userId'),
        ...options.headers
      };

      const response = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers
      });

      if (!response.ok) {
        const error = await response.json();
        showAlert(error.error || 'Error', 'error');
        throw new Error(error.error);
      }

      return response.json();
    }

    // UI Functions
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function showAlert(message, type = 'success') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert show ${type}`;
      setTimeout(() => alert.classList.remove('show'), 5000);
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // Dashboard
    async function loadDashboardStats() {
      try {
        const stats = await fetchAPI('/admin/stats');
        const grid = document.getElementById('statsGrid');
        grid.innerHTML = `
          <div class="stat-card">
            <h3>Total Users</h3>
            <div class="value">${stats.totalUsers}</div>
          </div>
          <div class="stat-card">
            <h3>Verified</h3>
            <div class="value">${stats.verifiedUsers}</div>
          </div>
          <div class="stat-card">
            <h3>Premium</h3>
            <div class="value">${stats.premiumUsers}</div>
          </div>
          <div class="stat-card">
            <h3>Tribunal Cases</h3>
            <div class="value">${stats.openTribunalCases}</div>
          </div>
          <div class="stat-card">
            <h3>Active Pubs</h3>
            <div class="value">${stats.activePubs}</div>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    // Users Management
    async function loadUsers() {
      try {
        const result = await fetchAPI('/admin/users?page=1&limit=50');
        renderUsersTable(result.users);
      } catch (err) {
        console.error(err);
      }
    }

    function renderUsersTable(users) {
      const html = `
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Full Name</th>
              <th>Role</th>
              <th>Verified</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>${u.email}</td>
                <td>${u.full_name}</td>
                <td><span class="badge ${u.role}">${u.role}</span></td>
                <td>${u.is_verified ? '✅' : '❌'}</td>
                <td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td>
                  <button class="action-btn" onclick="updateUserRole('${u.id}')">Change Role</button>
                  <button class="action-btn danger" onclick="suspendUser('${u.id}')">Suspend</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('usersTable').innerHTML = html;
    }

    function searchUsers() {
      const query = document.getElementById('userSearch').value.toLowerCase();
      const rows = document.querySelectorAll('#usersTable tbody tr');
      rows.forEach(row => {
        const email = row.cells[0].textContent.toLowerCase();
        row.style.display = email.includes(query) ? '' : 'none';
      });
    }

    async function updateUserRole(userId) {
      const newRole = prompt('Enter new role (user, co_founder, admin):');
      if (!newRole) return;

      try {
        await fetchAPI(`/admin/users/${userId}/role`, {
          method: 'PUT',
          body: JSON.stringify({ role: newRole })
        });
        showAlert('Role updated successfully');
        loadUsers();
      } catch (err) {
        console.error(err);
      }
    }

    async function suspendUser(userId) {
      const reason = prompt('Enter suspension reason:');
      if (!reason) return;

      try {
        await fetchAPI(`/admin/users/${userId}/suspend`, {
          method: 'POST',
          body: JSON.stringify({ reason })
        });
        showAlert('User suspended');
        loadUsers();
      } catch (err) {
        console.error(err);
      }
    }

    // Tribunal
    async function loadTribunalCases(status = 'open') {
      try {
        const cases = await fetchAPI(`/admin/tribunal?status=${status}`);
        renderTribunalTable(cases);
      } catch (err) {
        console.error(err);
      }
    }

    function renderTribunalTable(cases) {
      if (!cases || cases.length === 0) {
        document.getElementById('tribunalTable').innerHTML = '<p>No cases found</p>';
        return;
      }

      const html = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Complainant</th>
              <th>Defendant</th>
              <th>Type</th>
              <th>Status</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${cases.map(c => `
              <tr>
                <td>${c.id.substring(0, 8)}...</td>
                <td>${c.complainant?.email || 'Unknown'}</td>
                <td>${c.defendant?.email || 'Unknown'}</td>
                <td>${c.case_type}</td>
                <td><span class="badge">${c.status}</span></td>
                <td>${new Date(c.created_at).toLocaleDateString()}</td>
                <td>
                  ${c.status === 'open' ? `
                    <button class="action-btn success" onclick="openResolutionModal('${c.id}')">Resolve</button>
                  ` : ''}
                  <button class="action-btn" onclick="viewCase('${c.id}')">View</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('tribunalTable').innerHTML = html;
    }

    function openResolutionModal(caseId) {
      currentCase = caseId;
      document.getElementById('resolutionModal').classList.add('active');
    }

    async function submitResolution() {
      const resolution = document.getElementById('resolutionText').value;
      if (!resolution) {
        showAlert('Please enter a resolution', 'error');
        return;
      }

      try {
        await fetchAPI(`/admin/tribunal/${currentCase}/resolve`, {
          method: 'PUT',
          body: JSON.stringify({
            resolution,
            adminId: localStorage.getItem('userId')
          })
        });
        showAlert('Case resolved');
        closeModal('resolutionModal');
        loadTribunalCases('open');
        document.getElementById('resolutionText').value = '';
      } catch (err) {
        console.error(err);
      }
    }

    // Pubs
    async function loadPubs() {
      try {
        const pubs = await fetchAPI('/admin/pubs');
        renderPubsTable(pubs);
      } catch (err) {
        console.error(err);
      }
    }

    function renderPubsTable(pubs) {
      if (!pubs || pubs.length === 0) {
        document.getElementById('pubsTable').innerHTML = '<p>No pubs pending approval</p>';
        return;
      }

      const html = `
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>User</th>
              <th>Status</th>
              <th>Cost</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${pubs.map(p => `
              <tr>
                <td>${p.title}</td>
                <td>${p.user?.email || 'Unknown'}</td>
                <td><span class="badge">${p.status}</span></td>
                <td>${p.billets_cost} billets</td>
                <td>${new Date(p.created_at).toLocaleDateString()}</td>
                <td>
                  ${p.status === 'pending' ? `
                    <button class="action-btn success" onclick="approvePub('${p.id}')">Approve</button>
                    <button class="action-btn danger" onclick="rejectPub('${p.id}')">Reject</button>
                  ` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('pubsTable').innerHTML = html;
    }

    async function approvePub(pubId) {
      try {
        await fetchAPI(`/admin/pubs/${pubId}/approve`, {
          method: 'PUT'
        });
        showAlert('Pub approved');
        loadPubs();
      } catch (err) {
        console.error(err);
      }
    }

    async function rejectPub(pubId) {
      const reason = prompt('Rejection reason:');
      if (!reason) return;

      try {
        await fetchAPI(`/admin/pubs/${pubId}/reject`, {
          method: 'PUT',
          body: JSON.stringify({ reason })
        });
        showAlert('Pub rejected');
        loadPubs();
      } catch (err) {
        console.error(err);
      }
    }

    // Billets
    async function searchBilletsUser() {
      const query = document.getElementById('billetsSearch').value;
      if (query.length < 3) {
        document.getElementById('billetsForm').style.display = 'none';
        return;
      }

      try {
        const result = await fetchAPI(`/admin/users?page=1&limit=50`);
        const user = result.users.find(u => u.email.includes(query));
        if (user) {
          document.getElementById('billetsUserId').value = user.id;
          document.getElementById('billetsForm').style.display = 'block';
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function adjustBillets() {
      const userId = document.getElementById('billetsUserId').value;
      const amount = parseInt(document.getElementById('billetsAmount').value);
      const reason = document.getElementById('billetsReason').value;

      if (!userId || !amount || !reason) {
        showAlert('All fields required', 'error');
        return;
      }

      try {
        await fetchAPI(`/admin/billets/${userId}/adjust`, {
          method: 'POST',
          body: JSON.stringify({ amount, reason })
        });
        showAlert('Billets adjusted');
        document.getElementById('billetsAmount').value = '';
        document.getElementById('billetsReason').value = '';
      } catch (err) {
        console.error(err);
      }
    }

    // Activity
    async function loadActivity() {
      try {
        const activity = await fetchAPI('/admin/activity?days=7');
        renderActivityTable(activity);
      } catch (err) {
        console.error(err);
      }
    }

    function renderActivityTable(activity) {
      const html = `
        <table>
          <thead>
            <tr>
              <th>Email Type</th>
              <th>Count</th>
            </tr>
          </thead>
          <tbody>
            ${activity.map(a => `
              <tr>
                <td>${a.email_type}</td>
                <td>${a.total}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('activityTable').innerHTML = html;
    }

    // Logout
    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
